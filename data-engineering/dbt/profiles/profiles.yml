achat_vente_stock_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('ANALYTICS_POSTGRES_HOST', 'postgres-analytics') }}"
      port: "{{ env_var('ANALYTICS_POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('ANALYTICS_POSTGRES_USER', 'analytics_user') }}"
      password: "{{ env_var('ANALYTICS_POSTGRES_PASSWORD', 'analytics_password') }}"
      dbname: "{{ env_var('ANALYTICS_POSTGRES_DB', 'gestion_stock_analytics') }}"
      schema: marts
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
