services:
  postgres-analytics:
    image: postgres:16
    container_name: achat_stock_postgres_analytics
    environment:
      POSTGRES_USER: ${ANALYTICS_POSTGRES_USER:-analytics_user}
      POSTGRES_PASSWORD: ${ANALYTICS_POSTGRES_PASSWORD:-analytics_password}
      POSTGRES_DB: ${ANALYTICS_POSTGRES_DB:-gestion_stock_analytics}
    ports:
      - "5433:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_POSTGRES_USER:-analytics_user} -d ${ANALYTICS_POSTGRES_DB:-gestion_stock_analytics}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    container_name: achat_stock_airflow_postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER:-airflow} -d ${AIRFLOW_POSTGRES_DB:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.9.3
    container_name: achat_stock_airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      AIRFLOW__SMTP__SMTP_STARTTLS: ${SMTP_STARTTLS:-True}
      AIRFLOW__SMTP__SMTP_SSL: ${SMTP_SSL:-False}
      AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:-user@example.com}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:-change_me}
      AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:-587}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-airflow@example.com}
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname Data \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: achat_stock_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-analytics:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      AIRFLOW__SMTP__SMTP_STARTTLS: ${SMTP_STARTTLS:-True}
      AIRFLOW__SMTP__SMTP_SSL: ${SMTP_SSL:-False}
      AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:-user@example.com}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:-change_me}
      AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:-587}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-airflow@example.com}
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: achat_stock_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-analytics:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      AIRFLOW__SMTP__SMTP_STARTTLS: ${SMTP_STARTTLS:-True}
      AIRFLOW__SMTP__SMTP_SSL: ${SMTP_SSL:-False}
      AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:-user@example.com}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:-change_me}
      AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:-587}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-airflow@example.com}
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    restart: unless-stopped

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    container_name: achat_stock_dbt
    depends_on:
      postgres-analytics:
        condition: service_healthy
    working_dir: /usr/app
    environment:
      ANALYTICS_POSTGRES_HOST: ${ANALYTICS_POSTGRES_HOST:-postgres-analytics}
      ANALYTICS_POSTGRES_PORT: ${ANALYTICS_POSTGRES_PORT:-5432}
      ANALYTICS_POSTGRES_DB: ${ANALYTICS_POSTGRES_DB:-gestion_stock_analytics}
      ANALYTICS_POSTGRES_USER: ${ANALYTICS_POSTGRES_USER:-analytics_user}
      ANALYTICS_POSTGRES_PASSWORD: ${ANALYTICS_POSTGRES_PASSWORD:-analytics_password}
    volumes:
      - ./dbt:/usr/app
    command: ["debug", "--profiles-dir", "/usr/app/profiles"]

volumes:
  postgres_analytics_data:
  airflow_postgres_data:
